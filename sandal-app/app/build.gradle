plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'uz.aideveloper.sandal'
    compileSdk 34

    defaultConfig {
        applicationId "uz.aideveloper.sandal"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Сайт манзили шу ерда. Ўзгартириш керак бўлса, фақат шу қаторни алмаштиринг.
        buildConfigField "String", "SITE_URL", "\"https://sandal.aideveloper.uz/\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
